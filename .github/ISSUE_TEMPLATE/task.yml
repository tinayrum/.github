name: 🤖 開発タスク（Claude Code 実行用）
description: Claude Code に計画〜PR〜マージまで任せる作業。承認・質疑はこの Issue 上で選択肢方式で行う
title: "[Task]: "
labels: ["task", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        この Issue を起点に、Claude Code が「計画 → 着手承認(G1) → 実装 → 作業報告 → PR → マージ承認(G2)」の順で進めます。
        承認・質問は Claude Code が選択肢（Submit Answer）で問い合わせ、結果はこの Issue に「質疑記録」として残ります。
        詳細は `docs/development.md` を参照してください。

  - type: textarea
    id: goal
    attributes:
      label: 目的・背景 *
      description: なぜこの作業が必要か
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: やること *
      description: 作ってほしいもの・変えてほしいもの
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 完了条件 *
      description: これを満たせば完了と判断できる条件（確認方法も）
      placeholder: |
        - [ ] 〇〇が動作する（確認方法: …）
        - [ ] docs/ の該当ページが更新されている
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: やらないこと
      description: 今回の範囲外にしたいこと

  - type: dropdown
    id: branch_type
    attributes:
      label: ブランチ種別
      description: 作業ブランチの prefix（分岐元とマージ先は develop）
      options:
        - feature/（新機能・Minor）
        - bugfix/（バグ修正・Patch）
        - docs/（ドキュメントのみ・Patch）
        - chore/（メンテナンス・Patch）
        - おまかせ（計画時に提案）
    validations:
      required: true

  - type: dropdown
    id: release
    attributes:
      label: マージ後のリリース
      options:
        - develop へのマージで完了（リリースは別途）
        - develop マージ後、main へのリリースまで進める（G3 で確認）
    validations:
      required: true

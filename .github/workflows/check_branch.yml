# .github は main だけで運用する（develop は作らない）。main 向け PR のブランチ prefix だけを検査する。
name: Check Branch Naming

on:
  pull_request:
    branches: [main]
    # edited: マージ先（base）を変更したときにも再検査する
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/reusable-check-branch.yml
    with:
      strategy: main-only

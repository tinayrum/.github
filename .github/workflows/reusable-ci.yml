# 共通 CI（再利用ワークフロー）
#
# 呼び出し例（各リポジトリの .github/workflows/ci.yml）:
#
#   on:
#     pull_request:
#       branches: [main, develop]
#       types: [opened, synchronize, reopened, edited]
#     push:
#       branches: [develop]
#   permissions:
#     contents: read
#   jobs:
#     ci:
#       uses: tinayrum/.github/.github/workflows/reusable-ci.yml@main
#       with:
#         python-version: "3.12"
#
# develop → main（リリース）の PR では commit-lint と pr-title-lint を行わない。
# develop で検査済みのコミットを再検査しないため。squash のコミット名は PR タイトルになるので、通常の PR は pr-title-lint で担保する。
name: Reusable CI

on:
  workflow_call:
    inputs:
      docs-build:
        description: "mkdocs build --strict を実行する"
        type: boolean
        default: true
      python-version:
        description: "docs ビルドに使う Python のバージョン"
        type: string
        default: "3.12"
      requirements:
        description: "docs ビルド用の requirements ファイル"
        type: string
        default: "requirements.txt"
      commit-lint:
        description: "コミットメッセージと PR タイトルを type(scope): subject で検査する"
        type: boolean
        default: true
      docs-as-code:
        description: "src-path が変わったのに docs-path が変わっていない PR を失敗にする"
        type: boolean
        default: true
      src-path:
        description: "Docs as Code 検査でソースとみなすパス（前方一致）"
        type: string
        default: "src/"
      docs-path:
        description: "Docs as Code 検査でドキュメントとみなすパス（前方一致）"
        type: string
        default: "docs/"

permissions:
  contents: read

jobs:
  docs-build:
    name: Docs build (mkdocs --strict)
    if: inputs.docs-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements }}
      - name: Install dependencies
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: pip install -r "$REQUIREMENTS"
      - name: Build
        run: mkdocs build --strict

  commit-lint:
    name: "Commit message (type(scope): subject)"
    if: inputs.commit-lint && github.event_name == 'pull_request' && github.head_ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci)(\([^)]+\))?!?: ?.+'
          fail=0
          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            [[ "$subject" =~ ^Merge\  ]] && continue
            if [[ "$subject" =~ $pattern ]]; then
              echo "✅ $subject"
            else
              echo "::error::Invalid commit message: $subject"
              fail=1
            fi
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          if [[ $fail -ne 0 ]]; then
            echo "形式: type(scope): subject / type: feat, fix, docs, chore, refactor, test, ci"
          fi
          exit $fail

  pr-title-lint:
    name: "PR title (type(scope): subject)"
    if: inputs.commit-lint && github.event_name == 'pull_request' && github.head_ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci)(\([^)]+\))?!?: ?.+'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "✅ $PR_TITLE"
          else
            echo "::error::PR タイトルが規約に合っていません: $PR_TITLE"
            echo "squash マージ時のコミット名になるため、type(scope): subject で付けてください。"
            exit 1
          fi

  docs-as-code:
    name: Docs as Code (src/ changes need docs/)
    if: inputs.docs-as-code && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require docs update when source changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_DOCS: ${{ contains(github.event.pull_request.labels.*.name, 'skip-docs') }}
          SRC_PATH: ${{ inputs.src-path }}
          DOCS_PATH: ${{ inputs.docs-path }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "$changed"
          # 前方一致で判定する（パスに正規表現の記号が含まれていても誤判定しない）
          has_prefix() { awk -v p="$1" 'index($0, p) == 1 { found = 1 } END { exit !found }' <<< "$changed"; }
          if has_prefix "$SRC_PATH" && ! has_prefix "$DOCS_PATH"; then
            if [[ "$SKIP_DOCS" == "true" ]]; then
              echo "⚠️ $SRC_PATH changed without $DOCS_PATH, but 'skip-docs' label is set."
              exit 0
            fi
            echo "::error::$SRC_PATH が変更されていますが $DOCS_PATH が更新されていません（Docs as Code）。"
            echo "更新不要な場合は 'skip-docs' ラベルを付け、理由を PR 本文に書いてください。"
            exit 1
          fi
          echo "✅ OK"
